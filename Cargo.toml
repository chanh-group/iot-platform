[package]
name = "iot-server"
version = "0.1.0"
edition = "2024"
rust-version = "1.94"

[dependencies]
anyhow = "1.0.104"
arc-swap = "1.9.3"
argon2 = "0.6.0"
async-trait = "0.1.92"
axum = { version = "=0.8.9", features = ["json", "macros", "query", "ws"] }
axum-extra = { version = "0.12.6", features = ["cookie"] }
base64 = "0.23.1"
clap = { version = "4.6.7", features = ["derive"] }
futures-util = "0.3.31"
mime_guess = "2.0.5"
rand = "0.10.3"
rpassword = "7.5.4"
rust-embed = "8.13.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
sqlx = { version = "=0.9.0", default-features = false, features = ["macros", "migrate", "runtime-tokio", "sqlite"] }
subtle = "2.6.1"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["fs", "macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
tokio-util = "0.7.20"
toml = "1.1.8"
tower-http = { version = "0.7.1", features = ["timeout", "trace"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "json", "registry", "time"] }
uuid = { version = "1.29.0", features = ["serde", "v7"] }

[dev-dependencies]
assert_cmd = "2.2.2"
predicates = "3.1.4"
reqwest = { version = "0.13.5", features = ["cookies", "json"] }
rumqttc = "0.25.1"
tempfile = "3.27.0"
tokio-tungstenite = "0.30.0"
