services:
  iot-server:
    image: iot-server:local
    environment:
      IOT_METRICS_TOKEN: ${IOT_METRICS_TOKEN:-}
    # Run prepare-data.sh before first start; localhost-only, no plaintext MQTT on the Internet.
    ports:
      - "127.0.0.1:${IOT_HTTP_PORT:-8080}:8080"
      - "127.0.0.1:${IOT_MQTT_PORT:-1883}:1883"
    volumes:
      - "${IOT_DATA_DIR:-./data}:/app/data:Z"
      - "./conf.docker.toml:/app/conf.toml:ro,Z"
    init: true
    stop_grace_period: 20s
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/healthz"]
      interval: 5s
      timeout: 3s
      retries: 6
      start_period: 10s
