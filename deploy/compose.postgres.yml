services:
  postgres:
    image: postgres:18.6-bookworm
    environment:
      POSTGRES_DB: ${IOT_POSTGRES_DATABASE:-iot}
      POSTGRES_USER: iot
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
    volumes:
      - postgres_data:/var/lib/postgresql
      - "${IOT_POSTGRES_PASSWORD_FILE:?set IOT_POSTGRES_PASSWORD_FILE}:/run/secrets/postgres_password:ro,z"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s

  iot-server:
    image: ${IOT_SERVER_IMAGE:-iot-server:local}
    environment:
      IOT_DATABASE_URL: ${IOT_DATABASE_URL:?use deploy/compose-postgres.sh}
      IOT_METRICS_TOKEN: ${IOT_METRICS_TOKEN:-}
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "127.0.0.1:${IOT_HTTP_PORT:-8080}:8080"
      - "127.0.0.1:${IOT_MQTT_PORT:-1883}:1883"
    volumes:
      - iot_data:/app/data
      - "./conf.postgres.toml:/app/conf.toml:ro,z"
    init: true
    stop_grace_period: 20s
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/readyz"]
      interval: 5s
      timeout: 3s
      retries: 6
      start_period: 10s

volumes:
  iot_data:
  postgres_data:
