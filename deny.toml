[graph]
all-features = true

[advisories]
yanked = "warn"
# Chỉ advisory của dependency trực tiếp mới chặn release; advisory transitive
# (hiện từ rmqtt) được ghi nhận trong docs/release-checklist.md.
unmaintained = "workspace"

[licenses]
allow = [
    "MIT",
    "MIT-0",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
    "CDLA-Permissive-2.0",
    "CC0-1.0",
    "Unlicense",
]

[licenses.private]
ignore = true

[bans]
multiple-versions = "warn"
wildcards = "deny"
