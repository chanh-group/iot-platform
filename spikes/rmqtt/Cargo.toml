[package]
name = "rmqtt-spike"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
rmqtt = { version = "=0.24.0", default-features = false, features = ["retain"] }
anyhow = "1"
async-trait = "0.1"
tokio = { version = "=1.54.1", features = ["full"] }
tokio-util = "0.7.20"
bytes = "1"
log = "0.4"
env_logger = "0.11"

[dev-dependencies]
rumqttc = "=0.25.1"
serde_json = "1"
